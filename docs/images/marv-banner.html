.right{position:absolute;left:590px;top:62px;width:560px}

.sub{margin-top:18px;font:400 21px 'JetBrains Mono',monospace;color:#7c8b87}
.caps{margin-top:20px;font:500 14px 'JetBrains Mono',monospace;letter-spacing:1.6px;color:#2dd4bf}
.caps b{color:#f97316;font-weight:500}
.hr{position:absolute;left:150px;right:110px;top:370px;height:1px;background:rgba(238,252,248,.08)}
.stats{position:absolute;left:150px;top:392px;display:flex;gap:64px}
.stat .n{font:600 30px 'Space Grotesk',sans-serif;color:#eefcf8}
.stat .l{margin-top:4px;font:400 12px 'JetBrains Mono',monospace;letter-spacing:1.6px;color:#5f6d69}
