# Imports use explicit .ts/.tsx extensions (CLAUDE.md, Conventions): the project sets allowImportingTsExtensions and
# verbatimModuleSyntax, and Bun runs the sources as they are.
glob: ["src/**/*.{ts,tsx}", "tests/**/*.{ts,tsx}", "examples/**/*.ts", "evals/*.ts", "scripts/**/*.ts", "bin/**/*.ts"]
# This rule's own tests hold violations as data.
exclude: tests/project-checks.test.ts
# A relative import (from "./x", import "./x", import("./x"), export … from "./x") whose path has no extension.
forbid: '(?:\bfrom\s+|\bimport\s*\(\s*|^\s*import\s+)["''](\.{1,2}/[^"''\n]*?)(?<!\.tsx?|\.json|\.js|\.mjs|\.cjs|\.css)["'']'
flags: m
message: relative import without its extension (./x.ts, not ./x)
why: >-
  Imports use explicit .ts/.tsx extensions (allowImportingTsExtensions with verbatimModuleSyntax): Bun runs the sources
  as they are, and the published SDK is type-checked from src/ by its users' tsconfigs.
