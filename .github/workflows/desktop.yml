# Marv desktop on macOS (#208): builds the Tauri app (app/) as Marv.app and a .dmg on Apple silicon (macos-14) and
# Intel (macos-15-intel), then launches the built app and waits for it to reach `ready` (the window up, the bundled
# page running and talking to the backend: packaging/desktop/smoke-macos.sh). Unsigned (ad hoc), as the release
# builds it when no signing secrets are set. On pull requests that touch the app or the server it shares, and by hand.
name: Desktop

"on":
  pull_request:
    paths:
      - "app/**"
      - "crates/marv-web/**"
      - "packaging/desktop/**"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "crates/marv-web/**"
      - "packaging/desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14, arch: arm64 }
          - { runner: macos-15-intel, arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build Marv.app and the .dmg
        working-directory: app
        run: |
          npm ci
          npx tauri build --bundles app,dmg
      - name: Check the bundle
        run: |
          app=target/release/bundle/macos/Marv.app
          bin=$(find "$app/Contents/MacOS" -type f -perm -u+x | head -n 1)
          file "$bin"
          [ "$(lipo -archs "$bin")" = "${{ matrix.arch }}" ]
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist"
          # Ad hoc signed, so Apple silicon runs it and Gatekeeper offers "Open Anyway" rather than "damaged".
          codesign --verify --deep --strict --verbose=2 "$app"
          ls -l target/release/bundle/dmg/
      - name: The .dmg holds Marv.app
        run: |
          dmg=$(ls target/release/bundle/dmg/*.dmg)
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          ls -l "$mnt"
          test -d "$mnt/Marv.app"
          test -L "$mnt/Applications"
          hdiutil detach "$mnt"
      - name: Launch it and wait for ready
        run: packaging/desktop/smoke-macos.sh target/release/bundle/macos/Marv.app
      - uses: actions/upload-artifact@v4
        with:
          name: marv-desktop-${{ matrix.arch }}-dmg
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7
