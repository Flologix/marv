# Release (issues #19, #167): on a v* tag, static musl binaries for Linux x86_64 and aarch64, native binaries for
# macOS arm64 and x86_64, their SHA-256 sums and install.sh, attached to a GitHub Release.
#
# Assets (the names carry no version, so releases/latest/download/<asset> always names the newest):
#   marv-x86_64-unknown-linux-musl.tar.gz   (+ .sha256)
#   marv-aarch64-unknown-linux-musl.tar.gz  (+ .sha256)
#   marv-x86_64-apple-darwin.tar.gz         (+ .sha256)
#   marv-aarch64-apple-darwin.tar.gz        (+ .sha256)
#   marv-desktop-x86_64-apple-darwin.dmg    (+ .sha256)  Marv desktop (app/), #208
#   marv-desktop-aarch64-apple-darwin.dmg   (+ .sha256)
#   SHA256SUMS                              all of the above, which install.sh checks against
#   install.sh
#   flologixai-marv-*.tgz                   the npm packages (packaging/npm), published by hand
#
# Run it by hand (workflow_dispatch) for a dry run: everything but the release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh -n install.sh
      - run: packaging/test-install.sh

  build:
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # rust-toolchain.toml pins the channel; the target goes on that toolchain.
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # cargo-zigbuild links with zig's cc and musl, for both targets, from the x86_64 runner: ring's C and assembly
      # cross-compile with no sysroot to set up (cross would need Docker images).
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Build
        run: cargo zigbuild --release --locked -p marv-cli --target ${{ matrix.target }}
      - name: Check it's static
        run: |
          bin=target/${{ matrix.target }}/release/marv
          file "$bin"
          file "$bin" | grep -Eq 'static(ally|-pie) linked'
      - name: Smoke test
        if: startsWith(matrix.target, 'x86_64')
        run: |
          target/${{ matrix.target }}/release/marv --version
          MARV_TEST_BINARY=target/${{ matrix.target }}/release/marv packaging/test-install.sh
          packaging/npm/test.sh target/${{ matrix.target }}/release/marv
      - name: Package
        run: packaging/package.sh ${{ matrix.target }} target/${{ matrix.target }}/release/marv dist
      # bubblewrap for the sandboxed turn (the runners' AppArmor rule lifted, as in CI).
      - name: Smoke test the asset
        if: startsWith(matrix.target, 'x86_64')
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          packaging/smoke.sh ${{ matrix.target }} dist
      - uses: actions/upload-artifact@v4
        with:
          name: marv-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # macOS (#167): native runners, no zig; arm64 on Apple silicon, x86_64 on Intel, so each build is smoke-tested on
  # its own CPU. Rust's linker signs the arm64 binary ad hoc, which is all macOS needs to run it (it's never
  # quarantined: curl and npm don't set the flag).
  #
  # #208: the same runners build Marv desktop's .dmg. It's signed ad hoc unless the signing secrets are set
  # (APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY; and APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
  # to notarize): then Tauri signs it with the Developer ID and notarizes it. Without them, people open it once with
  # right-click → Open (README).
  build-macos:
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: aarch64-apple-darwin, runner: macos-14, arch: arm64 }
          - { target: x86_64-apple-darwin, runner: macos-15-intel, arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p marv-cli --target ${{ matrix.target }}
      - name: Check its CPU
        run: |
          bin=target/${{ matrix.target }}/release/marv
          file "$bin"
          [ "$(lipo -archs "$bin")" = "${{ matrix.arch }}" ]
      - name: Package
        run: packaging/package.sh ${{ matrix.target }} target/${{ matrix.target }}/release/marv dist
      # In place of a release candidate tried by hand on a Mac: install.sh and npm from the packed asset, and a
      # sandboxed `marv -p` turn (Seatbelt must refuse a write outside the project) with each. If it fails, the
      # release job doesn't run.
      - name: Smoke test
        run: |
          target/${{ matrix.target }}/release/marv --version
          packaging/smoke.sh ${{ matrix.target }} dist
          packaging/npm/test.sh target/${{ matrix.target }}/release/marv
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build Marv desktop (.dmg)
        working-directory: app
        env:
          MAC_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          MAC_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          MAC_ID: ${{ secrets.APPLE_ID }}
          MAC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          MAC_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm ci
          # Only set secrets reach Tauri: an empty APPLE_CERTIFICATE would make it try to import nothing.
          set -- --bundles app,dmg --target ${{ matrix.target }}
          if [ -n "$MAC_SIGNING_IDENTITY" ] && [ -n "$MAC_CERTIFICATE" ]; then
            echo "Signing with the Developer ID certificate"
            export APPLE_CERTIFICATE="$MAC_CERTIFICATE" APPLE_CERTIFICATE_PASSWORD="$MAC_CERTIFICATE_PASSWORD" \
              APPLE_SIGNING_IDENTITY="$MAC_SIGNING_IDENTITY"
            set -- "$@" --config "{\"bundle\":{\"macOS\":{\"signingIdentity\":\"$MAC_SIGNING_IDENTITY\"}}}"
            if [ -n "$MAC_ID" ] && [ -n "$MAC_PASSWORD" ] && [ -n "$MAC_TEAM_ID" ]; then
              echo "and notarizing"
              export APPLE_ID="$MAC_ID" APPLE_PASSWORD="$MAC_PASSWORD" APPLE_TEAM_ID="$MAC_TEAM_ID"
            fi
          else
            echo "No signing secrets: an unsigned (ad hoc) build"
          fi
          npx tauri build "$@"
      # The launch check CI runs (.github/workflows/desktop.yml), on the bundle that goes in the .dmg.
      - name: Smoke test Marv desktop
        run: |
          app=target/${{ matrix.target }}/release/bundle/macos/Marv.app
          bin=$(find "$app/Contents/MacOS" -type f -perm -u+x | head -n 1)
          [ "$(lipo -archs "$bin")" = "${{ matrix.arch }}" ]
          codesign --verify --deep --strict --verbose=2 "$app"
          packaging/desktop/smoke-macos.sh "$app"
      - name: Package Marv desktop
        run: |
          asset=marv-desktop-${{ matrix.target }}.dmg
          cp target/${{ matrix.target }}/release/bundle/dmg/*.dmg "dist/$asset"
          (cd dist && shasum -a 256 "$asset" >"$asset.sha256" && cat "$asset.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: marv-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [install-test, build, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: marv-*
          merge-multiple: true
      - name: SHA256SUMS
        run: |
          cp install.sh dist/
          cd dist
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-apple-darwin aarch64-apple-darwin; do
            [ -f "marv-$target.tar.gz" ] || { echo "marv-$target.tar.gz is missing"; exit 1; }
          done
          for target in x86_64-apple-darwin aarch64-apple-darwin; do
            [ -f "marv-desktop-$target.dmg" ] || { echo "marv-desktop-$target.dmg is missing"; exit 1; }
          done
          cat marv-*.tar.gz.sha256 marv-desktop-*.dmg.sha256 > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS
      # The npm packages go up as release assets too; publishing them needs the maintainer's 2FA, so it's done by hand
      # (packaging/npm/build.sh says the order).
      - name: npm packages
        run: |
          packaging/npm/build.sh "${GITHUB_REF_NAME#v}" dist npm
          mv npm/*.tgz dist/
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --title "Marv $GITHUB_REF_NAME" --generate-notes
