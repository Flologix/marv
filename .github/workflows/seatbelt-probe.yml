# Temporary (#166): the Seatbelt probes and guards on macOS for every push to the branch, before the full CI.
name: Seatbelt probe

"on":
  push:
    branches: [feat/166-seatbelt-wire]

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      MARV_REQUIRE_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: /usr/bin/sandbox-exec -p '(version 1)(allow default)' /usr/bin/true
      - run: cargo test -p marv-sandbox --lib
      - run: cargo test -p marv-guards --test seatbelt --test sandbox --no-fail-fast -- --test-threads=4
