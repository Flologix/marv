# Temporary (#166): runs the Seatbelt probes on macOS for every push to the branch, quickly, before the full CI.
name: Seatbelt probe

"on":
  push:
    branches: [feat/166-seatbelt-wire]

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: /usr/bin/sandbox-exec -p '(version 1)(allow default)' /usr/bin/true
      - run: cargo test -p marv-sandbox --test seatbelt_probe -- --ignored --nocapture --test-threads=1
