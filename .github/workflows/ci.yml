# CI for Marv: format, check, clippy and the tests, on every pull request and push to main. No secrets: nothing here
# calls a real model.
#
# The sandbox is Marv's main safety boundary, and its tests (the guards in tests/guards among them) skip where
# bubblewrap can't start a sandbox. So they are made to run, not skip: bubblewrap is installed, the AppArmor rule that
# stops Ubuntu 24.04's runners from creating unprivileged user namespaces (which bwrap needs) is lifted for the runner,
# a probe fails the job before the tests if bwrap still can't start, and MARV_REQUIRE_SANDBOX=1 makes the guard
# `where_the_sandbox_is_required_it_really_runs` fail rather than let a skipped run pass.
name: CI

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MARV_REQUIRE_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install bubblewrap and allow user namespaces
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The desktop app (app/src-tauri, a workspace member) links WebKitGTK, and Tauri embeds the built page at compile
      # time, so the page is built (and typechecked) first.
      - name: Install the desktop app's system libraries
        run: sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libayatana-appindicator3-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build the desktop app's page
        working-directory: app
        run: npm ci && npm run build
      # Fail here, with bwrap's own error, rather than let the sandbox tests skip.
      - name: Require a working sandbox
        run: bwrap --ro-bind / / --unshare-net --unshare-pid -- true
      # git (repositories, file listings) and python3 (some tests' servers and fixtures) come with the runner image;
      # this fails loudly if that ever changes.
      - name: Check the tools the tests need
        run: git --version && python3 --version
      - run: cargo fmt --all --check
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The tests must remove their temp folders (#89: a dev machine had ~6,000 left in /tmp, 6.7 GB, and the /tmp quota
      # filled). Count them before and after; any growth fails the job and lists what was left. `marv-<uid>` is the
      # shared runtime folder used without XDG_RUNTIME_DIR, kept on purpose.
      - name: Count temp folders before the tests
        run: |
          echo "TEMP_BEFORE=$(find /tmp -maxdepth 1 \( -name 'marv-*' -o -name 'mx-*' \) ! -name "marv-$(id -u)" | wc -l)" >> "$GITHUB_ENV"
      - run: cargo test --workspace --no-fail-fast
      - name: Fail if the tests left temp folders
        # Also after failed tests: a failing test is the likeliest to leave its folder behind.
        if: ${{ !cancelled() && env.TEMP_BEFORE != '' }}
        run: |
          left=$(find /tmp -maxdepth 1 \( -name 'marv-*' -o -name 'mx-*' \) ! -name "marv-$(id -u)" | sort)
          after=$(printf '%s' "$left" | grep -c . || true)
          echo "temp folders before: $TEMP_BEFORE, after: $after"
          if [ "$after" -gt "$TEMP_BEFORE" ]; then
            echo "the tests left temp folders in /tmp:"
            printf '%s\n' "$left"
            # What is in them names the writer (a test's cleanup raced with something still running).
            printf '%s\n' "$left" | while read -r d; do echo "== $d"; find "$d" -printf '%TT %M %s %p\n' 2>/dev/null | sort | head -40; done
            exit 1
          fi

  # macOS (#150): Marv compiles there but isn't ported yet. Not required: it shows what fails until it's green, then
  # it becomes a required check. There's no bubblewrap, so the sandbox tests skip (no MARV_REQUIRE_SANDBOX) until the
  # Seatbelt backend (#151).
  macos:
    runs-on: macos-14
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace --no-fail-fast
