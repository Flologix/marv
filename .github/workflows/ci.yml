# CI for Marv itself: typecheck, the test suite, and the evals' --verify, on every pull request and push to main.
# No secrets and no API keys: --verify only checks that every eval task's check fails on the task's repo and passes
# with its solution; the real-model runs are not for CI.
#
# The sandbox is Marv's main safety boundary and its tests are gated on bwrap, so they are made to run rather than
# skip: bubblewrap is installed, and Ubuntu 24.04's runners refuse unprivileged user namespaces (AppArmor), which
# bwrap needs, so the restriction is lifted for the runner machine. The job summary says whether the sandbox really
# ran, also when an earlier step failed. The runners already have git, python3 (the syntax check) and node (the
# system-wide interpreter of tsc's launcher, which sandboxed checks run), so only bwrap is installed here.
name: CI

"on":
  pull_request:
  push:
    branches: [main]

# Nothing is uploaded or pushed: reading the repository is all the token needs.
permissions:
  contents: read

# A new push to the same branch replaces the older run's verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    # The suite is ~90 s here; this only bounds a hung run (a stuck bwrap, a dead runner).
    timeout-minutes: 30
    steps:
      # Actions are pinned to full commit hashes (the version in the comment), so a moved tag can't change what
      # runs here without a reviewed change to this file.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No version given: the action reads engines.bun (>=1.3) from package.json and installs the newest release
      # matching it. It installs to ~/.bun/bin, which Marv's sandbox mounts as a toolchain, so sandboxed commands
      # (the eval checks run in one) can use bun.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # bun's download cache, so a PR without dependency changes reinstalls from disk. Keyed on the lockfile: a new
      # entry only when dependencies change, and restore-keys still uses the old cache for a partial match.
      - name: Cache bun installs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install bubblewrap and allow user namespaces
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # The sandbox tests skip when bwrap can't start a sandbox, which would let a green run skip Marv's main safety
      # boundary. Fail here instead, before the tests, with bwrap's own error.
      - name: Require a working sandbox
        run: bwrap --ro-bind / / --unshare-net --unshare-pid -- true

      # A few tests and eval checks need more than bun: git (repos, file listing), python3 (the syntax check) and
      # node, the system interpreter of tsc's `#!/usr/bin/env node` launcher, which sandboxed checks run. All three
      # ship with the runner image; this fails loudly if that ever changes.
      - name: Check the tools the tests need
        run: git --version && python3 --version && node --version

      - run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Eval tasks verify
        run: bun run eval --verify

      - name: Sandbox status in the job summary
        if: always()
        run: |
          if bwrap --ro-bind / / --unshare-net --unshare-pid -- true 2>/dev/null; then
            echo "sandbox: bwrap works — the sandbox tests ran." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "sandbox: bwrap is unavailable — the sandbox tests were **skipped**." >> "$GITHUB_STEP_SUMMARY"
          fi
