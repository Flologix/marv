# CI for Marv: format, check, clippy and the tests, on every pull request and push to main. No secrets: nothing here
# calls a real model.
#
# The sandbox is Marv's main safety boundary, and its tests (the guards in tests/guards among them) skip where
# bubblewrap can't start a sandbox. So they are made to run, not skip: bubblewrap is installed, the AppArmor rule that
# stops Ubuntu 24.04's runners from creating unprivileged user namespaces (which bwrap needs) is lifted for the runner,
# a probe fails the job before the tests if bwrap still can't start, and MARV_REQUIRE_SANDBOX=1 makes the guard
# `where_the_sandbox_is_required_it_really_runs` fail rather than let a skipped run pass.
name: CI

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MARV_REQUIRE_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install bubblewrap and allow user namespaces
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # install.sh and the npm launcher (#153: the messages on Windows; #167: the macOS targets and packages). Quick: no
      # real build needed.
      - name: Installer and npm launcher
        run: sh -n install.sh && packaging/test-install.sh && node --test packaging/npm/launcher.test.js
      # Fail here, with bwrap's own error, rather than let the sandbox tests skip.
      - name: Require a working sandbox
        run: bwrap --ro-bind / / --unshare-net --unshare-pid -- true
      # git (repositories, file listings) and python3 (some tests' servers and fixtures) come with the runner image;
      # this fails loudly if that ever changes.
      - name: Check the tools the tests need
        run: git --version && python3 --version
      - run: cargo fmt --all --check
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The tests must remove their temp folders (#89: a dev machine had ~6,000 left in /tmp, 6.7 GB, and the /tmp quota
      # filled). Count them before and after; any growth fails the job and lists what was left. `marv-<uid>` is the
      # shared runtime folder used without XDG_RUNTIME_DIR, kept on purpose.
      - name: Count temp folders before the tests
        run: |
          echo "TEMP_BEFORE=$(find /tmp -maxdepth 1 \( -name 'marv-*' -o -name 'mx-*' \) ! -name "marv-$(id -u)" | wc -l)" >> "$GITHUB_ENV"
      - run: cargo test --workspace --no-fail-fast
      - name: Fail if the tests left temp folders
        # Also after failed tests: a failing test is the likeliest to leave its folder behind.
        if: ${{ !cancelled() && env.TEMP_BEFORE != '' }}
        run: |
          left=$(find /tmp -maxdepth 1 \( -name 'marv-*' -o -name 'mx-*' \) ! -name "marv-$(id -u)" | sort)
          after=$(printf '%s' "$left" | grep -c . || true)
          echo "temp folders before: $TEMP_BEFORE, after: $after"
          if [ "$after" -gt "$TEMP_BEFORE" ]; then
            echo "the tests left temp folders in /tmp:"
            printf '%s\n' "$left"
            # What is in them names the writer (a test's cleanup raced with something still running).
            printf '%s\n' "$left" | while read -r d; do echo "== $d"; find "$d" -printf '%TT %M %s %p\n' 2>/dev/null | sort | head -40; done
            exit 1
          fi
      # The release smoke test on this build: install.sh and npm from a packed asset, a sandboxed turn with each.
      - name: Smoke test install.sh and npm
        run: |
          cargo build -p marv-cli
          packaging/package.sh x86_64-unknown-linux-musl target/debug/marv "$RUNNER_TEMP/assets"
          packaging/smoke.sh x86_64-unknown-linux-musl "$RUNNER_TEMP/assets"

  # macOS (#150, #167): a required check, on arm64 (macos-14, macos-15) and Intel (macos-15-intel; GitHub retired the
  # macos-13 image the spec named).
  # The sandbox is Seatbelt (#166: `sandbox-exec` with `marv __guard`), and as on Linux its guards must run, not skip:
  # MARV_REQUIRE_SANDBOX=1, and a broken `sandbox-exec` fails the job before the tests.
  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      MARV_REQUIRE_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Require a working sandbox
        run: /usr/bin/sandbox-exec -p '(version 1)(allow default)' /usr/bin/true
      # #152: the loopback report binds 127.0.0.2, to see whether Seatbelt refuses the rest of 127/8 (lo0 has only
      # 127.0.0.1).
      - name: Add a loopback alias for the sandbox probes
        continue-on-error: true
        run: sudo ifconfig lo0 alias 127.0.0.2 up
      - run: cargo check --workspace --all-targets
      # #152: what Seatbelt does with loopback rules on this runner, for the record. The process door stays off on
      # macOS because `localhost` rules don't keep a bind on loopback (2026-10-25); a change shows up in this log. It
      # never fails on Seatbelt's behaviour, and never blocks the job.
      - name: Seatbelt loopback probes (report)
        continue-on-error: true
        run: cargo test -p marv-sandbox --test seatbelt_probe -- --ignored --nocapture --exact loopback_probe_report
      - run: cargo test --workspace --no-fail-fast
      # The release smoke test on this build, in place of a release candidate tried by hand on a Mac: install.sh and
      # npm from a packed asset, and a sandboxed `marv -p` turn with each, in which Seatbelt must refuse a write
      # outside the project.
      - name: Smoke test install.sh, npm and a sandboxed turn
        run: |
          case $(uname -m) in arm64) target=aarch64-apple-darwin ;; *) target=x86_64-apple-darwin ;; esac
          cargo build -p marv-cli
          packaging/package.sh "$target" target/debug/marv "$RUNNER_TEMP/assets"
          packaging/smoke.sh "$target" "$RUNNER_TEMP/assets"
