[package]
name = "marv-session"
description = "The UI-free engine: MarvSession, config, prompt, sessions, trajectories, memory, skills, subagents."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio-util.workspace = true
marv-core.workspace = true
marv-fs.workspace = true
marv-provider.workspace = true
marv-agent.workspace = true
marv-tools.workspace = true
marv-sandbox.workspace = true
marv-mcp.workspace = true
marv-mesh.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true
anyhow.workspace = true
# Project keys (`paths::project_key`): Marv's sha256 of the root, first 10 hex digits.
sha2 = "0.10"
# Pure helpers ported with their regexes (tool drafts, AGENTS.md headings, feedback).
regex = "1.11"
# YAML frontmatter (SKILL.md, agent files) and `.marv/checks/*.yaml`. Marv used `Bun.YAML`.
serde_norway = "0.9"
# `.marv/checks` patterns are JavaScript regular expressions (Marv ran them with `RegExp`): an ECMAScript engine,
# not `regex`'s dialect.
regress = "0.12"
# `.marv/checks` globs, with Bun.Glob's semantics (`*` stays in its folder, `**` crosses them, `{a,b}`).
globset = "0.4"
# The home folder (`shorten_home`, `home_or_above`, personal skills and agents).
dirs = "6.0"
# Background processes (#51): signals to their sandboxes, and the uid for their socket folder.
nix = { version = "0.31.3", features = ["signal", "user"] }

[lints]
workspace = true
