[package]
name = "marv-cli"
description = "The marv binary: TUI, headless -p, mesh commands."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "marv"
path = "src/main.rs"

[dependencies]
marv-core.workspace = true
marv-session.workspace = true
marv-agent.workspace = true
marv-tools.workspace = true
marv-provider.workspace = true
marv-mesh.workspace = true
marv-mcp.workspace = true
# The TUI startup: hidden PATH folders and whether bubblewrap is here (`/sandbox`, `/yolo`).
marv-sandbox.workspace = true
# The TUI (launched by `marv` with no -p). marv-tui doesn't depend on marv-session; the bridge between its
# `view::SessionPort`/`UiEvent` and the session's API is marv-cli's to write (see docs/subsystems/cli.md).
marv-tui.workspace = true
tokio.workspace = true
futures.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
clap = { version = "4.6", features = ["derive"] }
# The mesh's switchboard is served until its token is cancelled (`mesh_cmd::Mesh`).
tokio-util.workspace = true
# `marv __guard` (#165): its session, its parent's pid and the signals it sends its process group.
nix = { version = "0.31.3", features = ["signal", "process"] }

[dev-dependencies]
# The two-Marv mesh test (tests/mesh.rs): the oracle's fake OpenAI-compatible server.
marv-oracle = { path = "../marv-oracle" }

[lints]
workspace = true
