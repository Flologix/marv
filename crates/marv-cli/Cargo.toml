[package]
name = "marv-cli"
description = "The marv binary: TUI, headless -p, mesh commands."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "marv"
path = "src/main.rs"

[dependencies]
marv-core.workspace = true
marv-session.workspace = true
marv-agent.workspace = true
marv-tools.workspace = true
marv-provider.workspace = true
marv-mesh.workspace = true
marv-mcp.workspace = true
# The TUI (launched by `marv` with no -p). marv-tui doesn't depend on marv-session; the bridge between its
# `view::SessionPort`/`UiEvent` and the session's API is marv-cli's to write (see docs/subsystems/cli.md).
marv-tui.workspace = true
tokio.workspace = true
futures.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
clap = { version = "4.6", features = ["derive"] }

[dev-dependencies]
tokio-util.workspace = true

[lints]
workspace = true
