[package]
name = "marv-tools"
description = "Tool trait, registry, approval flow and built-in tools."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio-util.workspace = true
marv-core.workspace = true
marv-sandbox.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
thiserror.workspace = true
similar = "2.7"
url = "2.5"
ignore = "0.4.33"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
grep-matcher = "0.1.9"
globset = "0.4.20"
regex = "1.13.1"
oxc_parser = "0.154.0"
oxc_allocator = "0.154.0"
oxc_span = "0.154.0"
oxc_semantic = "0.154.0"
oxc_diagnostics = "0.154.0"
serde_yaml_ng = "0.10.0"
nix = { version = "0.31.3", features = ["signal", "process"] }
marv-fs.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
dom_smoothie = "0.18.2"
dom_query = "0.28"
flate2 = "1"
brotli = "8"
# A trusted project skill's files are checked against their hashes when read (`skill::content_hash`).
sha2 = "0.10"
encoding_rs = "0.8"
# Content hashes of the files a session has seen (`file_versions`).
sha2 = "0.10"

[lints]
workspace = true
